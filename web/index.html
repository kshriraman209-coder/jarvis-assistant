<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #04070d;
    --panel: #0a1120;
    --line: #1c2f4a;
    --cyan: #3fe8ff;
    --cyan-dim: rgba(63, 232, 255, 0.12);
    --cyan-glow: rgba(63, 232, 255, 0.35);
    --gold: #ffc65c;
    --gold-dim: rgba(255, 198, 92, 0.12);
    --green: #4dffb4;
    --amber: #ffb24b;
    --red: #ff5c66;
    --text: #d8ecff;
    --muted: #6d8ba8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1400px 700px at 75% -15%, rgba(40,96,255,.13), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(0,229,255,.08), transparent 55%),
      var(--bg);
    color: var(--text);
    overflow: hidden;
    position: relative;
  }
  /* faint HUD grid overlay */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(63,232,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,232,255,.045) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask: radial-gradient(ellipse at center, black 40%, transparent 85%);
            mask: radial-gradient(ellipse at center, black 40%, transparent 85%);
  }
  /* CRT scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay; opacity: .5;
  }

  /* ===== Top bar: HUD command deck ===== */
  .topbar {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(10,18,34,.92), rgba(4,8,16,.5));
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(63,232,255,.18), 0 8px 28px rgba(0,0,0,.45);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 340px 100%, 320px 82%, 0 82%);
  }
  .arc {
    width: 46px; height: 46px; border-radius: 50%;
    position: relative; flex: none;
    will-change: transform, box-shadow;
    background:
      radial-gradient(circle at 38% 38%, #cdf7ff 0%, #7dead3 12%, #1b7f9e 38%, #0a2b3a 66%, #030c13 100%);
    box-shadow: 0 0 22px var(--cyan-glow), inset 0 0 14px rgba(200,255,255,.5);
    animation: corePulse 2.4s ease-in-out infinite;
  }
  .arc::after {
    content: ""; position: absolute; inset: 10px; border-radius: 50%;
    border: 1.5px solid rgba(210,255,255,.85);
    background: radial-gradient(circle, rgba(255,255,255,.85) 0 3px, rgba(120,235,255,.25) 26%, transparent 60%);
    box-shadow: 0 0 12px rgba(200,255,255,.7);
  }
  @keyframes corePulse { 50% { box-shadow: 0 0 34px var(--cyan-glow), inset 0 0 20px rgba(200,255,255,.7); } }
  .titlebar-ident { position: relative; }
  .title {
    font-family: "Consolas", "Courier New", monospace;
    font-weight: 700; font-size: 21px; letter-spacing: 5px;
    color: #eafaff; text-shadow: 0 0 14px var(--cyan-glow);
  }
  .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin-top: 2px; }
  .spacer { flex: 1; }

  .hud-stat {
    font-family: "Consolas", monospace; font-size: 11px; color: var(--muted);
    letter-spacing: 1px; text-align: right;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 10px; background: rgba(6,12,22,.7);
    box-shadow: inset 0 0 12px rgba(63,232,255,.05);
  }
  .hud-stat b { color: var(--cyan); font-weight: 600; }

  .badge {
    font-family: "Consolas", monospace; font-size: 11px; letter-spacing: 1px;
    padding: 6px 12px; border-radius: 3px;
    border: 1px solid var(--line); background: rgba(6,12,22,.8);
    cursor: pointer; user-select: none; transition: all .15s;
    position: relative;
  }
  .badge::before { content: "▸"; position: absolute; left: 4px; top: 5px; font-size: 8px; color: var(--muted); opacity: 0; }
  .badge:hover { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan-dim); }
  .badge.on { color: var(--green); border-color: rgba(77,255,180,.45); text-shadow: 0 0 8px rgba(77,255,180,.5); }
  .badge.off { color: var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; }
  .badge.on .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .badge.off .dot { background: var(--muted); }
  .badge .toggle { opacity:.8; margin-left:6px; font-size:9px; }
  .model-sel {
    font-family: "Consolas", monospace; font-size: 11px; letter-spacing: .5px;
    padding: 6px 10px; border-radius: 3px;
    border: 1px solid var(--line); background: var(--panel); color: var(--cyan);
    cursor: pointer; outline: none;
  }
  .model-sel:hover, .model-sel:focus { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan-dim); }

  /* ===== Layout ===== */
  .layout { position: relative; z-index: 1; display: grid; grid-template-columns: 290px 1fr; gap: 16px; padding: 18px 24px; height: calc(100% - 74px); }
  .sidebar, .chatbox {
    background: rgba(8,14,26,.78);
    border: 1px solid var(--line);
    border-radius: 4px;
    backdrop-filter: blur(7px);
    box-shadow: 0 0 0 1px rgba(63,232,255,.05), 0 10px 40px rgba(0,0,0,.5);
    position: relative;
  }
  .sidebar::before, .chatbox::before {
    content: ""; position: absolute; top: -1px; left: 18px; width: 46px; height: 2px;
    background: linear-gradient(90deg, var(--cyan), transparent);
  }
  .sidebar { padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .side-title {
    font-family: "Consolas", monospace; font-size: 10px; letter-spacing: 3px;
    color: var(--gold); text-transform: uppercase; margin: 6px 0 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .side-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .stat {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px;
    background: rgba(4,9,18,.6); position: relative; overflow: hidden;
  }
  .stat::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, transparent, var(--cyan), transparent);
  }
  .stat .k { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .stat .v { font-size: 12px; font-weight: 600; color: var(--cyan); text-shadow: 0 0 8px var(--cyan-dim); }

  .cmd {
    position: relative; overflow: hidden;
    padding: 10px 13px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer;
    font-family: "Consolas", monospace; font-size: 12px; color: var(--text);
    background: rgba(4,9,18,.6); transition: all .18s; text-align: left;
  }
  .cmd::before {
    content: "» "; color: var(--cyan); opacity: .4; transition: all .18s;
  }
  .cmd:hover {
    border-color: var(--cyan); color: #fff;
    background: linear-gradient(90deg, var(--cyan-dim), transparent 80%);
    box-shadow: 0 0 14px rgba(63,232,255,.12);
    transform: translateX(3px);
  }
  .cmd:hover::before { opacity: 1; color: var(--gold); }

  .chatbox { display: flex; flex-direction: column; min-height: 0; }
  .chathead {
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    font-family: "Consolas", monospace; font-size: 11px; color: var(--muted);
    display:flex; gap: 22px; align-items:center; letter-spacing: 1px;
    background: linear-gradient(180deg, rgba(63,232,255,.06), transparent);
  }
  .chathead b { color: var(--cyan); font-weight: 600; text-shadow: 0 0 8px var(--cyan-dim); }
  .credit {
    text-align: center; font-family: "Consolas", monospace; font-size: 10px;
    color: var(--muted); padding: 7px 0; border-top: 1px solid var(--line); letter-spacing: 2px;
    background: rgba(4,9,18,.4);
  }
  .credit b { color: var(--gold); font-weight: 600; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; position: relative; }
  .msg {
    max-width: 82%; padding: 12px 16px; border-radius: 4px;
    font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
    position: relative;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(64,49,12,.5), rgba(40,30,8,.45));
    border: 1px solid rgba(255,198,92,.35);
    border-bottom-right-radius: 0;
    box-shadow: 0 0 16px rgba(255,198,92,.06), 0 2px 10px rgba(0,0,0,.35);
  }
  .msg.user::after {
    content: ""; position: absolute; right: -1px; bottom: -1px; width: 16px; height: 16px;
    border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold); opacity: .55;
  }
  .msg.jarvis {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(16,34,52,.6), rgba(10,22,36,.55));
    border: 1px solid rgba(63,232,255,.25);
    border-bottom-left-radius: 0;
    box-shadow: 0 0 16px rgba(63,232,255,.05), 0 2px 10px rgba(0,0,0,.35);
  }
  .msg.jarvis::after {
    content: ""; position: absolute; left: -1px; bottom: -1px; width: 16px; height: 16px;
    border-left: 2px solid var(--cyan); border-bottom: 2px solid var(--cyan); opacity: .55;
  }
  .msg .who { font-family: "Consolas", monospace; font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: 2px; }
  .msg.user .who { color: var(--gold); text-shadow: 0 0 8px var(--gold-dim); }
  .msg.jarvis .who { color: var(--cyan); text-shadow: 0 0 8px var(--cyan-dim); }
  .msg .action-tag {
    color: var(--amber); font-family: "Consolas", monospace; font-size: 10px; letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .chip {
    align-self: flex-start; font-size: 11px; color: var(--muted);
    padding: 6px 12px; border-radius: 3px; border: 1px dashed var(--line);
    font-family: "Consolas", monospace;
  }
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: bounce 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce { 50% { transform: translateY(-5px); opacity:.35; } }

  .inputbar {
    display: flex; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); align-items: center;
    background: linear-gradient(0deg, rgba(63,232,255,.05), transparent);
  }
  #textin {
    flex: 1; background: rgba(4,9,18,.75); border: 1px solid var(--line); border-radius: 3px;
    padding: 12px 16px; color: var(--text); font-size: 14px; outline: none;
    font-family: "Consolas", monospace;
  }
  #textin:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px var(--cyan-dim), 0 0 16px rgba(63,232,255,.1); }
  .btn {
    border: 1px solid var(--line); border-radius: 3px; background: rgba(4,9,18,.8);
    color: var(--cyan); padding: 12px 20px; cursor: pointer; font-size: 13px; transition: all .15s;
    display: inline-flex; align-items: center; gap: 7px; user-select: none;
    font-family: "Consolas", monospace; letter-spacing: 1px;
    position: relative; overflow: hidden;
  }
  .btn:hover { border-color: var(--cyan); background: var(--cyan-dim); box-shadow: 0 0 14px rgba(63,232,255,.15); }
  .btn.icon { width: 50px; justify-content: center; padding: 12px 0; }
  .btn.mic.listening { background: #2b1d05; border-color: var(--amber); color: var(--amber); animation: pulse 1.2s infinite; box-shadow: 0 0 18px rgba(255,178,75,.3); will-change: opacity; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 7px 12px; font-size: 11px; border-radius: 3px; }
  .btn.danger { color: var(--red); border-color: rgba(255,92,102,.4); }
  .btn.danger:hover { border-color: var(--red); background: rgba(255,92,102,.12); }
  @keyframes pulse { 50% { opacity: .3; } }

  /* Scan sweep across the chat body — GPU-composited for smooth 60fps */
  .scanline {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    will-change: transform;
  }
  .scanline::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 30vh;
    background: linear-gradient(180deg, transparent, rgba(63,232,255,.045), transparent);
    animation: scan 7s linear infinite;
    will-change: transform;
  }
  @keyframes scan { to { transform: translateY(140vh); } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--line), #0e2a40); border-radius: 0; border: 1px solid rgba(63,232,255,.15); }
  ::-webkit-scrollbar-track { background: transparent; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2,5,10,.88); display: none;
    align-items: center; justify-content: center; z-index: 60;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 24px; width: 440px; max-width: 92%;
    box-shadow: 0 0 0 1px rgba(63,232,255,.08), 0 20px 60px rgba(0,0,0,.6);
  }
  .modal h3 { color: var(--cyan); margin-bottom: 12px; font-family: "Consolas", monospace; letter-spacing: 2px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .modal code {
    display: block; background: rgba(4,9,18,.8); border: 1px solid var(--line);
    padding: 9px 12px; border-radius: 3px; font-size: 12.5px; color: var(--green);
    margin: 6px 0; word-break: break-all; font-family: "Consolas", monospace;
  }
  .modal .btn { margin-top: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="arc"></div>
  <div class="titlebar-ident">
    <div class="title">J.A.R.V.I.S.</div>
    <div class="subtitle">A.KRITTHIK SHRIRAMAN &middot; LOCAL ASSISTANT PROTOCOL</div>
  </div>
  <div class="spacer"></div>
  <div class="hud-stat"><span id="hudClock">--:--:--</span> <b>SYS</b></div>
  <span class="badge" id="ollamaBadge"><span class="dot"></span><span id="ollamaText">checking Ollama…</span></span>
  <select id="modelSel" class="model-sel" title="Choose AI model"><option value="">Loading…</option></select>
  <span class="badge" id="voiceBadge" title="Toggle voice replies"><span class="dot"></span><span id="voiceText">Audio on</span><span class="toggle">&#9658;</span></span>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="side-title">System</div>
    <div class="stat"><span class="k">AI brain</span><span class="v" id="modelName">…</span></div>
    <div class="stat"><span class="k">Drive</span><span class="v" id="driveLabel">local</span></div>

    <div class="side-title">Ask JARVIS</div>
    <button class="cmd" data-txt="What time is it?">What time is it?</button>
    <button class="cmd" data-txt="System status">System status</button>
    <button class="cmd" data-txt="Take a screenshot">Take a screenshot</button>
    <button class="cmd" data-txt="Search Google for today's top news">Google search</button>
    <button class="cmd" data-txt="Search YouTube for lofi music">YouTube search</button>
    <button class="cmd" data-txt="Search images of cats">Image search</button>

    <div class="side-title">Do things</div>
    <button class="cmd" data-txt="Open Chrome">Open Chrome</button>
    <button class="cmd" data-txt="Open Notepad">Open Notepad</button>
    <button class="cmd" data-txt="Open Spotify">Open Spotify</button>
    <button class="cmd" data-txt="Open WhatsApp">Open WhatsApp</button>
    <button class="cmd" data-txt="Open file explorer">File explorer</button>
    <button class="cmd" data-txt="Move the mouse to 960, 500">Center mouse</button>
    <button class="cmd" data-txt="Scroll down">Scroll down</button>
    <button class="cmd" data-txt="Volume up">Volume up</button>
    <button class="cmd" data-txt="Lock the screen">Lock screen</button>

    <div class="side-title">Sample chat</div>
    <button class="cmd" data-txt="Tell me a fun fact about space">Space fact</button>
    <button class="cmd" data-txt="Explain how a jet engine works">Jet engines</button>
  </div>

  <div class="chatbox">
    <div class="scanline"></div>
    <div class="chathead">
      <span>MODEL: <b id="hhModel">…</b></span>
      <span>TURNS: <b id="hhTurns">0</b></span>
      <span id="hhState">READY</span>
      <span class="spacer"></span>
      <button id="clearBtn" class="btn small danger" title="Clear chat history (privacy)">PURGE</button>
    </div>
    <div id="messages"></div>
    <div class="credit">DEVELOPED BY <b>A. KRITTHIK SHRIRAMAN</b> &middot; © 2026</div>
    <div class="inputbar">
      <button class="btn icon mic" id="micBtn" title="Speak to JARVIS">&#127908;</button>
      <input id="textin" type="text" placeholder=">_ Ask, command, or search…" autocomplete="off">
      <button class="btn" id="sendBtn">EXECUTE</button>
    </div>
  </div>
</div>

<script>
const api = { chat: "/api/chat", speech: "/api/speech", status: "/api/status" };
const $ = (id) => document.getElementById(id);
const msgbox = $("messages");
let voiceOn = true;
let turns = 0;
const modelSel = $("modelSel");
const saved = localStorage.getItem("jarvis-history");
if (saved) { try { JSON.parse(saved).forEach(m => addMsg(m.role, m.text, m.meta)); } catch (e) {} }

/* Live HUD clock */
function tickClock() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  $("hudClock").textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
setInterval(tickClock, 1000);
tickClock();

function saveHistory() {
  const items = [];
  msgbox.querySelectorAll(".msg").forEach((el) => {
    const role = el.classList.contains("user") ? "user" : "jarvis";
    const text = el.childNodes[el.childNodes.length - 1].textContent;
    const meta = el.querySelector(".action-tag") ? "action" : null;
    items.push({ role, text, meta });
  });
  localStorage.setItem("jarvis-history", JSON.stringify(items.slice(-100)));
}

function addMsg(role, text, meta) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = role === "user" ? "[ SIR ]" : "[ J.A.R.V.I.S. ]";
  div.appendChild(who);
  if (meta === "action") {
    const tag = document.createElement("div");
    tag.className = "action-tag";
    tag.textContent = "[ SYSTEM ACTION EXECUTED ]";
    div.appendChild(tag);
  }
  div.appendChild(document.createTextNode(text));
  msgbox.appendChild(div);
  msgbox.scrollTop = msgbox.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "chip";
  div.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  div.id = "typing";
  msgbox.appendChild(div);
  msgbox.scrollTop = msgbox.scrollHeight;
}
function hideTyping() {
  const t = $("typing");
  if (t) t.remove();
}
function setState(s) {
  $("hhState").textContent = s.toUpperCase();
  if (s.toLowerCase().includes("think")) $("hhState").style.color = "var(--amber)";
  else $("hhState").style.color = "var(--muted)";
}

let playToken = 0;
function speak(text) {
  if (!voiceOn) return;
  const token = ++playToken;
  try {
    const url = api.speech + "?text=" + encodeURIComponent(text);
    const audio = new Audio(url);
    audio.onerror = () => { if (token === playToken) fallbackSpeak(text); };
    const started = audio.play();
    if (started && started.then) started.catch(() => { if (token === playToken) fallbackSpeak(text); });
  } catch (e) {
    if (token === playToken) fallbackSpeak(text);
  }
}

function fallbackSpeak(text) {
  try {
    const s = new SpeechSynthesisUtterance(text);
    s.rate = 1.05; s.pitch = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(s);
  } catch (e) { /* no audio */ }
}

async function send(text) {
  text = (text || "").trim();
  if (!text) return;
  addMsg("user", text);
  saveHistory();
  $("textin").value = "";
  showTyping();
  setState("thinking…");
  try {
    const r = await fetch(api.chat, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    hideTyping();
    const meta = data.action ? "action" : null;
    addMsg("jarvis", data.reply, meta);
    turns++;
    $("hhTurns").textContent = turns;
    setState("ready");
    saveHistory();
    speak(data.reply);
    if (autoListen) setTimeout(() => micBtn.click(), 900);
  } catch (e) {
    hideTyping();
    setState("connection error");
    addMsg("jarvis", "Network error: " + e.message);
  }
}

/* ---- Voice input ---- */
let recognizing = false;
let autoListen = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $("micBtn");

if (SR) {
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onstart = () => { recognizing = true; micBtn.classList.add("listening"); micBtn.title = "Stop listening"; };
  rec.onerror = (e) => { recognizing = false; micBtn.classList.remove("listening"); };
  rec.onend = () => { recognizing = false; micBtn.classList.remove("listening"); };
  rec.onresult = (e) => {
    const t = e.results[0][0].transcript;
    $("textin").value = t;
    send(t);
  };
  micBtn.onclick = () => {
    if (recognizing) { rec.stop(); return; }
    try { rec.start(); } catch (e) { /* busy */ }
  };
} else {
  micBtn.title = "Microphone needs Chrome/Edge";
  micBtn.disabled = true;
}

$("sendBtn").onclick = () => send($("textin").value);
$("textin").addEventListener("keydown", (e) => { if (e.key === "Enter") send(e.target.value); });

/* Clear chat history (localStorage + server memory) */
$("clearBtn").onclick = async () => {
  if (!confirm("Purge all chat history? This cannot be undone, sir.")) return;
  localStorage.removeItem("jarvis-history");
  msgbox.innerHTML = "";
  turns = 0;
  $("hhTurns").textContent = "0";
  setState("purged");
  try {
    await fetch("/api/clear", { method: "POST" });
  } catch (e) { /* server memory best-effort */ }
  addMsg("jarvis", "Chat history purged, sir. This conversation is now private.");
};
document.querySelectorAll(".cmd").forEach((b) => b.onclick = () => send(b.dataset.txt));

/* Voice reply toggle */
$("voiceBadge").onclick = () => {
  voiceOn = !voiceOn;
  if (voiceOn && !SR) voiceOn = false;
  $("voiceText").textContent = voiceOn ? "Audio on" : "Audio off";
  $("voiceBadge").classList.toggle("off", !voiceOn && !SR);
  $("voiceBadge").classList.toggle("on", voiceOn || !SR);
  if (!voiceOn) try { speechSynthesis.cancel(); } catch (e) {}
};

function fillModelSelect(models, active) {
  modelSel.innerHTML = "";
  (models || []).forEach((m) => {
    const o = document.createElement("option");
    o.value = m.key;
    o.textContent = m.label;
    if (m.key === active) o.selected = true;
    modelSel.appendChild(o);
  });
}

modelSel.onchange = async () => {
  const chosen = modelSel.value;
  if (!chosen) return;
  modelSel.disabled = true;
  setState("switching…");
  try {
    const r = await fetch("/api/mode", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: chosen }),
    });
    const s = await r.json();
    if (!r.ok) throw new Error(s.error || "switch failed");
    $("modelName").textContent = s.model;
    $("hhModel").textContent = s.model;
    $("driveLabel").textContent = (s.mode === "ollama" ? "local" : "cloud") + " · " + s.mode;
    setState("ready");
    addMsg("jarvis", "Brain switched to " + s.model + " (" + s.mode + ").");
  } catch (e) {
    setState("switch failed");
    addMsg("jarvis", "Could not switch model: " + e.message);
  } finally {
    modelSel.disabled = false;
  }
};

(async () => {
  try {
    const r = await fetch(api.status);
    const s = await r.json();
    $("modelName").textContent = s.model;
    $("hhModel").textContent = s.model;
    fillModelSelect(s.models, s.mode);
    if (s.ollama) {
      $("ollamaText").textContent = "Brain online";
      $("ollamaBadge").classList.add("on");
    } else {
      $("ollamaText").textContent = "Brain offline";
      $("ollamaBadge").classList.add("off");
    }
    $("driveLabel").textContent = (s.local ? "local" : "cloud") + " · " + s.mode;
  } catch (e) { /* offline */ }
  if (!msgbox.querySelector(".msg")) {
    addMsg("jarvis", "All systems are online, sir. Ask me anything, or click the microphone and speak with me.");
    speak("Good to see you, sir. All systems are online and ready.");
  }
})();
</script>
</body>
</html>
